name: Nightly fuzz

# The claims fuzz test runs 10 seeds on every PR to keep CI fast. This runs
# many more each night, so rare malformed-answer cases still get found.
# Re-run a failing seed locally with: pytest tests/test_compass_claims_fuzz.py -k "seed_<n>"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Claims fuzz (200 seeds)
        run: uv run pytest -q -n auto tests/test_compass_claims_fuzz.py
        env:
          COMPASS_FUZZ_SEEDS: "200"
