name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Gitleaks
        # GitHub's release download sometimes returns 5xx for a while (it did
        # for over 10 minutes on 2026-11-08). Retry it, save to a file first so
        # tar never reads a half-downloaded stream, and fall back to the same
        # version's official Docker Hub image if it still fails.
        run: |
          VERSION=8.30.0
          if curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors \
               -o gitleaks.tar.gz \
               "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"; then
            tar -xzf gitleaks.tar.gz gitleaks
            rm gitleaks.tar.gz
          else
            echo "::warning::GitHub release download failed; using Docker Hub image"
            id=$(docker create "zricethezav/gitleaks:v${VERSION}")
            docker cp "$id":/usr/bin/gitleaks ./gitleaks
            docker rm "$id"
          fi
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git --redact -c .gitleaks.toml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: README command reference
        run: uv run python scripts/check_readme_commands.py

      - name: Pre-commit hooks (lint, format, bandit, gitleaks, import-linter, radon, pytest-fast)
        run: uv run pre-commit run --all-files

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Import contracts (import-linter)
        run: uv run lint-imports

      - name: Typecheck (mypy)
        run: uv run mypy src --config-file mypy.ini

      - name: Full tests with coverage enforcement
        run: COVERAGE=1 uv run pytest -q --disable-warnings --cov=src/obsidian_ai_tools --cov=src/vault_compass --cov-fail-under=80

      - name: CRAP gate (complexity x coverage)
        run: |
          uv run radon cc src -s -j > cc.json
          uv run coverage json -o coverage.json
          uv run python scripts/crap_report.py
