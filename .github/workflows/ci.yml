name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit
        run: bandit -c pyproject.toml -r src/

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git --redact -c .gitleaks.toml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install types-requests

      - name: Install package
        run: pip install -e .

      - name: README command reference
        run: python scripts/check_readme_commands.py

      - name: Lint (ruff)
        run: make lint

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Complexity (radon)
        run: make radon

      - name: Full tests with coverage enforcement
        run: make coverage
