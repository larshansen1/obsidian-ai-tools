name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Pre-commit (all checks)
        run: uv run pre-commit run --all-files

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Pre-commit (lint, format, radon, fast tests)
        run: uv run pre-commit run --all-files

      - name: Typecheck (mypy)
        run: uv run mypy src --config-file mypy.ini

      - name: Full tests with coverage enforcement
        run: COVERAGE=1 uv run pytest --cov --cov-report=term-missing --disable-warnings