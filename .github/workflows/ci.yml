name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: README command reference
        run: uv run python scripts/check_readme_commands.py

      - name: Pre-commit hooks (lint, format, bandit, gitleaks, radon, pytest-fast)
        run: uv run pre-commit run --all-files

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy src --config-file mypy.ini

      - name: Full tests with coverage enforcement
        run: COVERAGE=1 uv run pytest -q --disable-warnings --cov=src/obsidian_ai_tools --cov-fail-under=80