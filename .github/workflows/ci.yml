name: CI

# Runs once per change, on the pull request. No second run on merge to main:
# as a solo repo, main rarely moves between the PR run and the merge. Update
# the branch before merging if it did.
on:
  pull_request:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Gitleaks
        # GitHub's release download sometimes returns 5xx for a while (it did
        # for over 10 minutes on 2026-11-08). Retry it, save to a file first so
        # tar never reads a half-downloaded stream, and fall back to the same
        # version's official Docker Hub image if it still fails.
        run: |
          VERSION=8.30.0
          if curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors \
               -o gitleaks.tar.gz \
               "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"; then
            tar -xzf gitleaks.tar.gz gitleaks
            rm gitleaks.tar.gz
          else
            echo "::warning::GitHub release download failed; using Docker Hub image"
            id=$(docker create "zricethezav/gitleaks:v${VERSION}")
            docker cp "$id":/usr/bin/gitleaks ./gitleaks
            docker rm "$id"
          fi
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git --redact -c .gitleaks.toml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Commit-stage hooks: ruff lint + format, bandit, README check,
      # import-linter, radon. Each check runs only here, not again as its own
      # step. gitleaks is skipped because the hook scans staged files only and
      # CI has none; the security job above does the real scan.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files
        env:
          SKIP: gitleaks

      - name: Typecheck (mypy)
        run: uv run mypy src --config-file mypy.ini

      - name: Full tests with coverage (parallel)
        run: uv run pytest -q -n auto --cov --cov-report=term --cov-fail-under=80

      - name: CRAP gate (complexity x coverage)
        run: ./scripts/crap_gate.sh
