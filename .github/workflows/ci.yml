name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install types-requests

      - name: Install package
        run: pip install -e .

      - name: README command reference
        run: python scripts/check_readme_commands.py

      - name: Lint (ruff)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Complexity (radon)
        run: make radon

      - name: Full tests with coverage enforcement
        run: make coverage
