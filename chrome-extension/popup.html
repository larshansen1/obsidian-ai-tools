<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kai</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 340px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-size: 13px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #313244;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #cba6f7; }
    .status-wrap { display: flex; align-items: center; gap: 6px; }
    .status-label { font-size: 11px; color: #6c7086; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #45475a;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .dot.ok  { background: #a6e3a1; }
    .dot.err { background: #f38ba8; }

    /* ── URL row ── */
    .url-box {
      padding: 10px 16px;
      border-bottom: 1px solid #313244;
    }
    .row-label {
      font-size: 10px; color: #6c7086;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .url-text {
      color: #89b4fa; font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Button ── */
    .actions { padding: 12px 16px; }
    button {
      width: 100%; padding: 9px;
      background: #cba6f7; color: #1e1e2e;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .spinner {
      width: 12px; height: 12px;
      border: 2px solid rgba(30,30,46,0.3);
      border-top-color: #1e1e2e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Result ── */
    .result {
      padding: 0 16px 14px;
      display: none;
    }
    .result.visible { display: block; }

    .result-title {
      font-weight: 600; margin-bottom: 4px; line-height: 1.4;
    }
    .success .result-title { color: #a6e3a1; }
    .error   .result-title { color: #f38ba8; }

    .result-detail {
      color: #a6adc8; font-size: 11px; line-height: 1.5;
      word-break: break-all;
    }

    .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      background: #313244; color: #cba6f7;
      padding: 2px 7px; border-radius: 10px; font-size: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>kai</h1>
    <div class="status-wrap">
      <span class="status-label" id="status-label">checking…</span>
      <div class="dot" id="dot"></div>
    </div>
  </header>

  <div class="url-box">
    <div class="row-label">Current page</div>
    <div class="url-text" id="url">—</div>
  </div>

  <div class="actions">
    <button id="btn" disabled>
      <span class="spinner" id="spinner"></span>
      <span id="btn-label">Ingest into Obsidian</span>
    </button>
  </div>

  <div class="result" id="result">
    <div class="result-title" id="result-title"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="tags" id="tags"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
